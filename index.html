<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Croissant Dash</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="c"></canvas>

  <div id="ui">

    <!-- Mobile touch controls (shown during gameplay only) -->
    <div id="mobile-controls" style="display:none">
      <button id="btn-jump"  class="mob-btn">▲</button>
      <button id="btn-right" class="mob-btn">▶</button>
    </div>

    <!-- Main Menu -->
    <div id="menu">
      <h1>Croissant Dash</h1>
      <p class="sub">~ a cozy bakery racing game ~</p>
      <div id="level-grid"></div>
      <div class="ctrl-box">
        <b>Move:</b> Arrow Left / Right &nbsp;|&nbsp; <b>Jump:</b> Arrow Up<br>
        <b>Mobile:</b> Jump ▲ (bottom-left) &nbsp;|&nbsp; Run ▶ (bottom-right)
      </div>
    </div>

    <!-- Level Card (shown before each level starts) -->
    <div id="levelcard" style="display:none">
      <h2 id="lc-title"></h2>
      <div class="difficulty" id="lc-diff"></div>
      <p id="lc-desc"></p>
      <div class="btn-row">
        <button class="main-btn" onclick="beginLevel()">Go!</button>
        <button class="sec-btn"  onclick="showMenu()">Back</button>
      </div>
    </div>

    <!-- Win Screen -->
    <div id="win" style="display:none">
      <h2 id="win-title"></h2>
      <p  id="win-sub"></p>
      <div class="btn-row">
        <button class="main-btn" id="win-next"></button>
        <button class="sec-btn"  onclick="showMenu()">Menu</button>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover" style="display:none">
      <h2>Oh no!</h2>
      <p  id="go-sub"></p>
      <div class="btn-row">
        <button class="main-btn" id="go-retry"></button>
        <button class="sec-btn"  onclick="showMenu()">Menu</button>
      </div>
    </div>

    <!-- Progress bar (shown during gameplay) -->
    <div id="progress-bar" style="display:none"><div id="progress-fill"></div></div>

    <!-- HUD (shown during gameplay) -->
    <div id="hud" style="display:none">
      <div class="hud-item lvc" id="h-level">Level 1</div>
      <div class="hud-item bgc" id="h-bags">Baguettes: 0</div>
    </div>

  </div>

  <!--
    Script load order matters — each file depends on the ones above it:
      config  →  constants & level data
      render  →  sprite & scene drawing (uses ctx, level)
      player  →  Player class (uses GRAVITY, keys, drawCroissant)
      level   →  level builder & collision checks (uses LEVEL_DEFS, player)
      ui      →  menus & HUD (uses everything above)
      main    →  game loop, input, boot (ties it all together)
  -->
  <script src="js/config.js"></script>
  <script src="js/render.js"></script>
  <script src="js/player.js"></script>
  <script src="js/level.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
